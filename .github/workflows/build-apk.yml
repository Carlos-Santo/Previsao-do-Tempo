name: Build APK

# Em todo push: analisa, testa e gera o APK (baixável em "Artifacts").
# Em push no main (ou execução manual): também publica uma Release com o APK,
# que pode ser baixada direto no celular em /releases/latest.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Baixar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk previsao-do-tempo.apk

      - name: Guardar o APK como artifact
        uses: actions/upload-artifact@v7
        with:
          name: previsao-do-tempo-apk
          path: previsao-do-tempo.apk
          retention-days: 30

      - name: Publicar Release com o APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" previsao-do-tempo.apk \
            --target "$GITHUB_SHA" \
            --title "Previsão do Tempo $TAG" \
            --latest \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7} (branch ${GITHUB_REF_NAME}).

          **Para instalar no Android:** baixe o arquivo \`previsao-do-tempo.apk\` abaixo pelo celular, abra-o e permita a instalação de apps desta fonte quando o Android pedir.

          Se já tiver uma versão anterior instalada e o Android recusar a atualização, desinstale a anterior e instale esta."
